apiVersion: apps/v1
kind: Deployment
metadata:
  name: pipeline-web-app
  labels:
    app: pipeline-web-app
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1       # Create 1 new pod before killing an old one
      maxUnavailable: 0 # Keep all existing pods alive during rollout for zero downtime
  selector:
    matchLabels:
      app: pipeline-web-app
  template:
    metadata:
      labels:
        app: pipeline-web-app
    spec:
      containers:
      - name: web-container
        image: anivil08/pipeline-app:IMAGE_TAG
        ports:
        - containerPort: 80
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: pipeline-web-app-service
spec:
  type: NodePort
  selector:
    app: pipeline-web-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30080
